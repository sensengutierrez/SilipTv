# Gumagawa ng PadalaKo app (APK) at inilalagay sa GitHub Releases.
# Download: https://github.com/sensengutierrez/SilipTv/releases/latest/download/PadalaKo.apk
# Sa ibang branch (claude/...), bina-build lang para ma-check; sa main lang naglalabas ng release.
name: Build Android app
on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Ihanda ang file
        run: cp android/app/build/outputs/apk/release/app-release.apk PadalaKo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PadalaKo-apk
          path: PadalaKo.apk
      - name: Ilagay sa Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: PadalaKo ${{ github.run_number }}
          body: |
            PadalaKo: padala, ipon at bayarin ng OFW.
            I-download ang PadalaKo.apk at buksan para i-install.
          files: PadalaKo.apk
          make_latest: true
